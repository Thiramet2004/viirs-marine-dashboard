<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIIRS Marine Dashboard - Embeddable</title>
<style>
/* Remove scroll and margins for clean iframe embedding */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  font-family: 'IBM Plex Sans Thai', 'Segoe UI', sans-serif;
}

/* Container for responsive sizing */
.embed-container {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px;
  box-sizing: border-box;
}

/* Responsive iframe message */
.embed-notice {
  background: #f0f9ff;
  border: 2px solid #3b82f6;
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 0.875rem;
  color: #1e40af;
  display: flex;
  align-items: center;
  gap: 8px;
}

.embed-notice a {
  color: #2563eb;
  text-decoration: underline;
  font-weight: 600;
}

/* Hide notice in standalone mode */
.standalone .embed-notice {
  display: none;
}

/* Loading indicator */
.loading {
  text-align: center;
  padding: 40px;
  color: #64748b;
}

.spinner {
  border: 4px solid #e2e8f0;
  border-top: 4px solid #3b82f6;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .embed-container {
    padding: 8px;
  }
  
  .embed-notice {
    font-size: 0.75rem;
    padding: 8px 12px;
  }
}
</style>
</head>
<body>

<div class="embed-container">
  <!-- Embed Notice (hidden when standalone) -->
  <div class="embed-notice">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
    </svg>
    <span>
      Dashboard แบบเต็ม: 
      <a href="http://localhost:5001/" target="_blank" rel="noopener noreferrer">
        เปิดในหน้าต่างใหม่ →
      </a>
    </span>
  </div>

  <!-- Loading Indicator -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>กำลังโหลด Dashboard...</div>
  </div>

  <!-- Embedded iframe -->
  <iframe 
    id="dashboardFrame"
    src="index.html"
    style="display: none; width: 100%; height: 1200px; border: 1px solid #e2e8f0; border-radius: 8px;"
    onload="handleIframeLoad()"
  ></iframe>
</div>

<script>
// Parse URL parameters
const urlParams = new URLSearchParams(window.location.search);
const mode = urlParams.get('mode'); // 'map', 'charts', or null (full)
const standalone = urlParams.get('standalone') === 'true';

// Hide notice in standalone mode
if (standalone) {
  document.body.classList.add('standalone');
}

// Handle iframe load
function handleIframeLoad() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboardFrame').style.display = 'block';
  
  // Send mode to iframe if specified
  if (mode) {
    const iframe = document.getElementById('dashboardFrame');
    iframe.contentWindow.postMessage({ type: 'setMode', mode: mode }, '*');
  }
}

// Listen for size adjustments from iframe
window.addEventListener('message', function(event) {
  if (event.data.type === 'resize') {
    const iframe = document.getElementById('dashboardFrame');
    iframe.style.height = event.data.height + 'px';
  }
});

// Adjust iframe height based on mode
if (mode === 'map') {
  document.getElementById('dashboardFrame').style.height = '600px';
} else if (mode === 'charts') {
  document.getElementById('dashboardFrame').style.height = '800px';
}
</script>

</body>
</html>
