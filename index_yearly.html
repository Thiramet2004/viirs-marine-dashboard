<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIIRS Marine Dashboard | รายปี</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
<style>
:root{--ink:#17324d;--blue:#1769aa;--line:#dbe5ec;--paper:#f5f8fa;--card:#fff;--red:#d94841;--green:#16866a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 'IBM Plex Sans Thai','Segoe UI',sans-serif}.top{background:var(--ink);color:#fff;padding:20px 24px}.top-inner,.page{max-width:1500px;margin:auto}.top h1{margin:0;font-size:1.35rem}.top p{margin:2px 0 0;color:#c8d6e1}.page{padding:22px 24px}.controls,.grid,.kpis{display:grid;gap:14px}.controls{grid-template-columns:repeat(4,minmax(150px,1fr));background:var(--card);padding:16px;border:1px solid var(--line);border-radius:10px;margin-bottom:16px}.control label{display:block;font-weight:700;font-size:.75rem;margin-bottom:4px}.control select,.tabs button{width:100%;padding:9px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink);font:inherit}.tabs{display:flex;gap:8px}.tabs button{cursor:pointer}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.kpi,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}.kpi small{display:block;color:#607586}.kpi strong{display:block;font-size:1.35rem;margin-top:3px}.grid{grid-template-columns:1.1fr .9fr;margin-bottom:16px}.panel h2{margin:0 0 10px;font-size:1rem}.map{height:500px;border-radius:7px;overflow:hidden}.chart{height:430px}.wide{grid-column:1/-1}.insight{border-left:4px solid var(--green);background:#eff9f5;padding:12px 14px;border-radius:5px}.loading{color:#647b8a}.error{color:#b42318}@media(max-width:850px){.controls,.kpis,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.page{padding:14px}.map{height:420px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><h1>VIIRS Marine Dashboard · รายปี</h1><p>ภาพรวมแนวโน้ม anomaly รายปีของอ่าวไทยและทะเลอันดามัน</p></div></header>
<main class="page">
<section class="controls">
 <div class="control"><label>พารามิเตอร์</label><div class="tabs"><button class="param active" data-param="sst">SST</button><button class="param" data-param="chl">Chl-a</button></div></div>
 <div class="control"><label>ปีที่เลือก</label><select id="year"></select></div>
 <div class="control"><label>พื้นที่วิเคราะห์</label><select id="zone"><option value="overall">ภาพรวม</option><option value="upper_gulf">อ่าวไทยตอนบน</option><option value="rayong">อ่าวระยอง</option><option value="trat">อ่าวตราด</option><option value="central_gulf">อ่าวไทยตอนกลาง</option><option value="lower_gulf">อ่าวไทยตอนล่าง</option><option value="andaman">ทะเลอันดามัน</option></select></div>
 <div class="control"><label>มุมมอง</label><div class="tabs"><button class="view active" data-view="anomaly">Anomaly</button><button class="view" data-view="trend">Trend</button></div></div>
</section>
<section class="kpis"><div class="kpi"><small>ค่าเฉลี่ย anomaly</small><strong id="mean">-</strong></div><div class="kpi"><small>ต่ำสุด</small><strong id="min">-</strong></div><div class="kpi"><small>สูงสุด</small><strong id="max">-</strong></div><div class="kpi"><small>ปีที่เลือก</small><strong id="yearLabel">-</strong></div></section>
<section class="grid"><article class="panel"><h2 id="mapTitle">Yearly anomaly map</h2><div id="map" class="map"></div></article><article class="panel"><h2>สรุปเชิงวิเคราะห์</h2><div id="insight" class="insight loading">กำลังโหลดข้อมูล...</div><div class="chart"><canvas id="trendChart"></canvas></div></article><article class="panel wide"><h2>เปรียบเทียบ anomaly รายปีตามพื้นที่</h2><div class="chart"><canvas id="zoneChart"></canvas></div></article></section>
</main>
<script>
const API='/api', RAW='https://raw.githubusercontent.com/Thiramet2004/viirs-marine-dashboard/main';
let param='sst', view='anomaly', selectedYear=2025, stats=null, map=null, layer=null, trendChart=null, zoneChart=null;
const zoneNames={overall:'ภาพรวม',upper_gulf:'อ่าวไทยตอนบน',rayong:'อ่าวระยอง',trat:'อ่าวตราด',central_gulf:'อ่าวไทยตอนกลาง',lower_gulf:'อ่าวไทยตอนล่าง',andaman:'ทะเลอันดามัน'};
const palette={sst:{min:-5,max:5,stops:[[-5,[0,0,100],],[-2,[48,153,255]],[0,[255,255,255]],[2,[255,160,10]],[5,[110,0,0]]],unit:'°C',label:'SST'},chl:{min:-20,max:20,stops:[[-20,[0,0,100]],[-8,[48,153,255]],[0,[255,255,255]],[8,[255,160,10]],[20,[110,0,0]]],unit:'mg/m³',label:'Chl-a'}};
function color(value){const p=palette[param],s=p.stops;if(value<=s[0][0])return `rgb(${s[0][1]})`;if(value>=s.at(-1)[0])return `rgb(${s.at(-1)[1]})`;for(let i=0;i<s.length-1;i++){if(value<=s[i+1][0]){const a=s[i],b=s[i+1],t=(value-a[0])/(b[0]-a[0]);return `rgb(${a[1].map((v,j)=>Math.round(v+t*(b[1][j]-v))).join(',')})`}}}
function rasterUrl(year){if(location.hostname==='localhost'||location.hostname==='127.0.0.1')return `${API}/yearly/${param}/${year}`;return `${RAW}/data/Yearly_RGB/${param}/${param}_Yearly_Anomaly_RGB_${year}.tif`}
function valuesForZone(){const y=String(selectedYear);return stats[param]?.[y]?.zones?.[document.getElementById('zone').value]??stats[param]?.[y]?.mean??null}
function update(){const p=palette[param], record=stats[param][selectedYear];const value=valuesForZone();document.getElementById('mean').textContent=value===null?'-':`${value.toFixed(param==='sst'?2:3)} ${p.unit}`;document.getElementById('min').textContent=`${record.min.toFixed(2)} ${p.unit}`;document.getElementById('max').textContent=`${record.max.toFixed(2)} ${p.unit}`;document.getElementById('yearLabel').textContent=`${selectedYear} (${selectedYear+543})`;document.getElementById('mapTitle').textContent=`${p.label} anomaly · ${zoneNames[document.getElementById('zone').value]} · ${selectedYear}`;document.getElementById('insight').className='insight';document.getElementById('insight').textContent=value===null?'ยังไม่มีข้อมูลโซนนี้':`${p.label} ปี ${selectedYear} ของ ${zoneNames[document.getElementById('zone').value]} มีค่า anomaly เฉลี่ย ${value.toFixed(param==='sst'?2:3)} ${p.unit}`;renderCharts();loadMap()}
function renderCharts(){const years=stats.years,d=stats[param];if(trendChart)trendChart.destroy();trendChart=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:years,datasets:[{label:`${palette[param].label} anomaly`,data:years.map(y=>d[y].mean),borderColor:'#1769aa',backgroundColor:'rgba(23,105,170,.12)',fill:true,tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});if(zoneChart)zoneChart.destroy();const zones=Object.keys(zoneNames).filter(z=>z!=='overall');zoneChart=new Chart(document.getElementById('zoneChart'),{type:'bar',data:{labels:zones.map(z=>zoneNames[z]),datasets:[{label:`${palette[param].label} ${selectedYear}`,data:zones.map(z=>stats[param][selectedYear].zones?.[z]??null),backgroundColor:zones.map((z,i)=>color(stats[param][selectedYear].zones?.[z]??0))}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})}
async function loadMap(){if(!map)map=L.map('map').setView([7.5,101.25],6);if(!map._layers||Object.keys(map._layers).length<2)L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);if(layer)map.removeLayer(layer);try{const response=await fetch(rasterUrl(selectedYear));if(!response.ok)throw Error(`HTTP ${response.status}`);const raster=await parseGeoraster(await response.arrayBuffer());layer=new GeoRasterLayer({georaster:raster,opacity:.86,pixelValuesToColorFn:v=>v[0]===0&&v[1]===0&&v[2]===0?null:`rgb(${v[0]},${v[1]},${v[2]})`,resolution:1024}).addTo(map);map.fitBounds([[raster.ymin,raster.xmin],[raster.ymax,raster.xmax]])}catch(error){document.getElementById('insight').textContent=`โหลด raster ไม่สำเร็จ: ${error.message}`}}
async function init(){const response=await fetch(`${API}/yearly/stats`);stats=await response.json();const years=stats.years;const select=document.getElementById('year');years.forEach(year=>{const option=document.createElement('option');option.value=year;option.textContent=`${year} (${year+543})`;select.appendChild(option)});select.value=selectedYear;document.querySelectorAll('.param').forEach(button=>button.onclick=()=>{document.querySelectorAll('.param').forEach(item=>item.classList.remove('active'));button.classList.add('active');param=button.dataset.param;update()});document.querySelectorAll('.view').forEach(button=>button.onclick=()=>{document.querySelectorAll('.view').forEach(item=>item.classList.remove('active'));button.classList.add('active');view=button.dataset.view;update()});select.onchange=()=>{selectedYear=Number(select.value);update()};document.getElementById('zone').onchange=update;update()}
init();
</script>
</body>
</html>
